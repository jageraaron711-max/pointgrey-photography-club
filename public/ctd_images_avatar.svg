<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#000000" />
  
  <defs>
    <!-- Clip for elements inside the white CTD shape -->
    <clipPath id="ctd-inner-clip">
      <path d="
        M 145 190
        L 355 190
        A 65 65 0 0 1 420 255
        A 65 65 0 0 1 355 320
        L 145 320
        A 65 65 0 0 1 80 255
        A 65 65 0 0 1 145 190
        Z
      " />
    </clipPath>
  </defs>

  <!-- The White CTD Composite Graphic -->
  <g fill="#FFFFFF">
    <!-- C: Left Outer Curve & Horizontal Bars -->
    <path d="
      M 145 190
      L 205 190
      L 205 222
      L 145 222
      A 33 33 0 0 0 112 255
      A 33 33 0 0 0 145 288
      L 192 288
      L 192 255
      L 192 320
      L 145 320
      A 65 65 0 0 1 80 255
      A 65 65 0 0 1 145 190
      Z
    " />

    <!-- T: Central Stem and Top Bar -->
    <path d="
      M 205 190
      L 305 190
      L 305 222
      L 272 222
      L 272 320
      L 238 320
      L 238 222
      L 205 222
      Z
    " />

    <!-- D: Left Spine & Right Rounded Loop with Hollow Center -->
    <path d="
      M 305 190
      L 355 190
      A 65 65 0 0 1 420 255
      A 65 65 0 0 1 355 320
      L 305 320
      Z
      M 338 222
      L 355 222
      A 33 33 0 0 1 388 255
      A 33 33 0 0 1 355 288
      L 338 288
      Z
    " fill-rule="evenodd" />
  </g>

  <!-- The Text 'images' - Upper Half (White on Black) -->
  <g fill="#FFFFFF">
    <clipPath id="above-ctd">
      <rect x="0" y="0" width="500" height="190" />
    </clipPath>
    <text 
      x="250" 
      y="212" 
      text-anchor="middle" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-weight="900" 
      font-size="62" 
      letter-spacing="-1.5px"
      clip-path="url(#above-ctd)"
    >images</text>
  </g>

  <!-- The Text 'images' - Lower Half (Black on White CTD) -->
  <g fill="#000000">
    <clipPath id="below-ctd">
      <rect x="0" y="190" width="500" height="310" />
    </clipPath>
    <text 
      x="250" 
      y="212" 
      text-anchor="middle" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-weight="900" 
      font-size="62" 
      letter-spacing="-1.5px"
      clip-path="url(#below-ctd)"
    >images</text>
  </g>
</svg>
